<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickDict Settings</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Deep space dark mode palette */
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --input-bg: #0f172a;
      --border: #334155;
      --success: #10b981;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 380px;
      border: 1px solid var(--border);
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h2 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 0.5rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    input[type="password"] {
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.875rem 1rem;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    input[type="password"]::placeholder {
      color: #475569;
    }

    button {
      width: 100%;
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 0.875rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98); /* Satisfying little click effect */
    }

    #status {
      margin-top: 1.25rem;
      font-size: 0.875rem;
      text-align: center;
      min-height: 1.25rem; /* Prevents layout jump when text appears */
      color: var(--success);
      opacity: 0;
      transform: translateY(-5px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #status.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>QuickDict</h2>
      <p class="subtitle">Configure your API access</p>
    </div>
    
    <div class="input-group">
      <label for="apiKey">API Key</label>
      <input type="password" id="apiKey" placeholder="sk-xxxxxxxxxxxxxxxxxxxx..." spellcheck="false">
    </div>
    
    <button id="save">Save Configuration</button>
    <p id="status"></p>
  </div>

  <script src="options.js"></script>

  </body>
</html>
